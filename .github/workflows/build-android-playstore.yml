name: Build Android Play Store (AAB & APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  issue_comment:
    types: [ created ]

permissions:
  contents: write

jobs:
  build-android-playstore:
    name: Build Android Play Store Bundle (.aab) & Universal APK (.apk)
    if: github.event_name != 'issue_comment' || contains( (github.event.comment.body), 'build' )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Platform 36 & Build-Tools 36.0.0
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | sort -V | tail -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Trace_Android_PlayStore.zip
        run: |
          mkdir -p _build_android release-out
          ZIP_FILE=$(find . -maxdepth 2 -iname "*Android*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting Android archive: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d _build_android
          elif [ -d "android/app" ]; then
            cp -r android/* _build_android/
          elif [ -d "app/src/main" ]; then
            cp -r app build.gradle settings.gradle gradle.properties _build_android/ 2>/dev/null || true
          fi

      - name: Verify & Self-Heal Android Widget, Theme, Legal Pages & Signing Config
        shell: python3 {0}
        run: |
          import os, textwrap

          base = "_build_android"
          for d in [
              "app/src/main/res/values",
              "app/src/main/res/xml",
              "app/src/main/res/layout",
              "app/src/main/res/drawable",
              "app/src/main/java/com/muneebwanee/trace",
          ]:
              os.makedirs(os.path.join(base, d), exist_ok=True)

          manifest = os.path.join(base, "app/src/main/AndroidManifest.xml")
          if os.path.exists(manifest):
              txt = open(manifest, encoding="utf-8").read().replace('package="com.muneebwanee.trace"', '')
              open(manifest, "w", encoding="utf-8").write(txt)

          def write_file(rel_path, content):
              p = os.path.join(base, rel_path)
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).strip() + chr(10))

          write_file("app/build.gradle", r'''
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.muneebwanee.trace'
              compileSdk 36

              defaultConfig {
                  applicationId "com.muneebwanee.trace"
                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName "0.0.1"
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = false
                  }
              }

              signingConfigs {
                  release {
                      def ksPath = System.getenv("ANDROID_KEYSTORE_PATH") ?: "upload-keystore.jks"
                      storeFile file(ksPath)
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "trace_store_pass_2026"
                      keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "upload"
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: "trace_key_pass_2026"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          ''')

          write_file("app/src/main/res/values/strings.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Trace</string>
              <string name="widget_desc">Minimalist daily stream clock and mirror ritual widget.</string>
          </resources>
          ''')

          write_file("app/src/main/res/xml/trace_widget_info.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:minResizeWidth="180dp"
              android:minResizeHeight="110dp"
              android:maxResizeWidth="520dp"
              android:maxResizeHeight="320dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/trace_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen|keyguard"
              android:description="@string/widget_desc" />
          ''')

          write_file("app/src/main/res/drawable/widget_bg_paper.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F5F5F3" />
              <corners android:radius="22dp" />
              <stroke android:width="1dp" android:color="#1F222220" />
          </shape>
          ''')

          write_file("app/src/main/res/drawable/widget_bg_dark.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#161615" />
              <corners android:radius="22dp" />
              <stroke android:width="1dp" android:color="#24F5F5F3" />
          </shape>
          ''')

          write_file("app/src/main/res/drawable/widget_dot_filled.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#222220" />
              <size android:width="5dp" android:height="5dp" />
          </shape>
          ''')

          write_file("app/src/main/res/drawable/widget_dot_light.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#F5F5F3" />
              <size android:width="5dp" android:height="5dp" />
          </shape>
          ''')

          write_file("app/src/main/res/drawable/widget_btn_circle.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#12222220" />
              <stroke android:width="1dp" android:color="#28222220" />
          </shape>
          ''')

          write_file("app/src/main/res/drawable/widget_btn_circle_dark.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#1AF5F5F3" />
              <stroke android:width="1dp" android:color="#33F5F5F3" />
          </shape>
          ''')

          write_file("app/src/main/res/layout/trace_widget.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg_paper"
              android:orientation="vertical"
              android:padding="14dp">

              <RelativeLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content">

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentStart="true"
                      android:layout_centerVertical="true"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <ImageView
                          android:id="@+id/widget_node_dot"
                          android:layout_width="6dp"
                          android:layout_height="6dp"
                          android:layout_marginEnd="6dp"
                          android:src="@drawable/widget_dot_filled" />

                      <TextClock
                          android:id="@+id/widget_date_clock"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:format12Hour="EEE MMM d"
                          android:format24Hour="EEE MMM d"
                          android:letterSpacing="0.06"
                          android:textAllCaps="true"
                          android:textColor="#88222220"
                          android:textSize="10sp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentEnd="true"
                      android:layout_centerVertical="true"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/widget_theme_btn"
                          android:layout_width="24dp"
                          android:layout_height="24dp"
                          android:layout_marginEnd="6dp"
                          android:background="@drawable/widget_btn_circle"
                          android:gravity="center"
                          android:text="☾"
                          android:textColor="#222220"
                          android:textSize="11sp" />

                      <TextView
                          android:id="@+id/widget_stamp_btn"
                          android:layout_width="24dp"
                          android:layout_height="24dp"
                          android:background="@drawable/widget_btn_circle"
                          android:gravity="center"
                          android:text="+"
                          android:textColor="#222220"
                          android:textSize="13sp" />
                  </LinearLayout>
              </RelativeLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">

                  <TextClock
                      android:id="@+id/widget_time_clock"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:fontFamily="serif"
                      android:format12Hour="HH:mm"
                      android:format24Hour="HH:mm"
                      android:textColor="#222220"
                      android:textSize="34sp" />

                  <TextClock
                      android:id="@+id/widget_sec_clock"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="5dp"
                      android:layout_marginTop="6dp"
                      android:fontFamily="monospace"
                      android:format12Hour=":ss"
                      android:format24Hour=":ss"
                      android:textColor="#66222220"
                      android:textSize="11sp" />
              </LinearLayout>

              <FrameLayout
                  android:id="@+id/widget_divider"
                  android:layout_width="match_parent"
                  android:layout_height="1dp"
                  android:layout_marginTop="4dp"
                  android:layout_marginBottom="7dp"
                  android:background="#22222220" />

              <RelativeLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content">

                  <TextView
                      android:id="@+id/widget_entry_text"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_alignParentStart="true"
                      android:layout_toStartOf="@+id/widget_stats_text"
                      android:layout_marginEnd="8dp"
                      android:ellipsize="end"
                      android:fontFamily="serif"
                      android:maxLines="1"
                      android:text="Tap + to mark this moment"
                      android:textColor="#99222220"
                      android:textSize="11.5sp" />

                  <TextView
                      android:id="@+id/widget_stats_text"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentEnd="true"
                      android:layout_centerVertical="true"
                      android:fontFamily="monospace"
                      android:text="0d • 0w"
                      android:textColor="#66222220"
                      android:textSize="9.5sp" />
              </RelativeLayout>
          </LinearLayout>
          ''')

          write_file("app/src/main/java/com/muneebwanee/trace/TraceWidgetProvider.java", r'''
          package com.muneebwanee.trace;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.widget.RemoteViews;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class TraceWidgetProvider extends AppWidgetProvider {

              public static final String ACTION_WIDGET_STAMP = "com.muneebwanee.trace.ACTION_WIDGET_STAMP";
              public static final String ACTION_WIDGET_THEME_TOGGLE = "com.muneebwanee.trace.ACTION_WIDGET_THEME_TOGGLE";
              public static final String WIDGET_PREFS = "trace_widget_prefs";
              public static final String KEY_TODAY_TEXT = "today_text";
              public static final String KEY_STATS_TEXT = "stats_text";
              public static final String KEY_PENDING_STAMP = "pending_stamp";
              public static final String KEY_DARK_MODE = "dark_mode";

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int appWidgetId : appWidgetIds) {
                      updateSingleWidget(context, appWidgetManager, appWidgetId);
                  }
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (ACTION_WIDGET_STAMP.equals(intent.getAction())) {
                      SharedPreferences prefs = context.getSharedPreferences(WIDGET_PREFS, Context.MODE_PRIVATE);
                      String stamp = "[" + new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date()) + "] ";
                      String current = prefs.getString(KEY_TODAY_TEXT, "");
                      String updated = (current == null || current.trim().isEmpty())
                              ? ("Marked at " + stamp)
                              : (current + "  " + stamp);
                      String existingPending = prefs.getString(KEY_PENDING_STAMP, "");
                      String nl = String.valueOf((char) 10);
                      String nextPending = (existingPending == null || existingPending.isEmpty())
                              ? stamp
                              : (existingPending + nl + stamp);
                      prefs.edit()
                              .putString(KEY_TODAY_TEXT, updated)
                              .putString(KEY_PENDING_STAMP, nextPending)
                              .apply();
                      updateAllWidgets(context);
                  } else if (ACTION_WIDGET_THEME_TOGGLE.equals(intent.getAction())) {
                      SharedPreferences prefs = context.getSharedPreferences(WIDGET_PREFS, Context.MODE_PRIVATE);
                      boolean currentDark = prefs.getBoolean(KEY_DARK_MODE, false);
                      prefs.edit().putBoolean(KEY_DARK_MODE, !currentDark).apply();
                      updateAllWidgets(context);
                  }
              }

              public static void updateAllWidgets(Context context) {
                  AppWidgetManager manager = AppWidgetManager.getInstance(context);
                  int[] ids = manager.getAppWidgetIds(new ComponentName(context, TraceWidgetProvider.class));
                  for (int id : ids) {
                      updateSingleWidget(context, manager, id);
                  }
              }

              public static void updateSingleWidget(Context context, AppWidgetManager appWidgetManager, int appWidgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(WIDGET_PREFS, Context.MODE_PRIVATE);
                  String todayText = prefs.getString(KEY_TODAY_TEXT, "");
                  String statsText = prefs.getString(KEY_STATS_TEXT, "0d • 0w");
                  boolean isDark = prefs.getBoolean(KEY_DARK_MODE, false);

                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.trace_widget);

                  int inkColor = isDark ? Color.parseColor("#F5F5F3") : Color.parseColor("#222220");
                  int mutedColor = isDark ? Color.parseColor("#88F5F5F3") : Color.parseColor("#88222220");
                  int subtleColor = isDark ? Color.parseColor("#66F5F5F3") : Color.parseColor("#66222220");
                  int dividerColor = isDark ? Color.parseColor("#24F5F5F3") : Color.parseColor("#22222220");

                  views.setInt(R.id.widget_root, "setBackgroundResource", isDark ? R.drawable.widget_bg_dark : R.drawable.widget_bg_paper);
                  views.setImageViewResource(R.id.widget_node_dot, isDark ? R.drawable.widget_dot_light : R.drawable.widget_dot_filled);
                  views.setInt(R.id.widget_theme_btn, "setBackgroundResource", isDark ? R.drawable.widget_btn_circle_dark : R.drawable.widget_btn_circle);
                  views.setInt(R.id.widget_stamp_btn, "setBackgroundResource", isDark ? R.drawable.widget_btn_circle_dark : R.drawable.widget_btn_circle);
                  views.setInt(R.id.widget_divider, "setBackgroundColor", dividerColor);

                  views.setTextColor(R.id.widget_date_clock, mutedColor);
                  views.setTextColor(R.id.widget_time_clock, inkColor);
                  views.setTextColor(R.id.widget_sec_clock, subtleColor);
                  views.setTextColor(R.id.widget_theme_btn, inkColor);
                  views.setTextColor(R.id.widget_stamp_btn, inkColor);
                  views.setTextColor(R.id.widget_entry_text, (todayText == null || todayText.trim().isEmpty()) ? subtleColor : inkColor);
                  views.setTextColor(R.id.widget_stats_text, subtleColor);

                  views.setTextViewText(R.id.widget_theme_btn, isDark ? "☀" : "☾");

                  if (todayText == null || todayText.trim().isEmpty()) {
                      views.setTextViewText(R.id.widget_entry_text, "Tap + to mark this moment");
                  } else {
                      String oneLine = todayText.replace((char) 10, ' ').replace((char) 13, ' ').trim();
                      views.setTextViewText(R.id.widget_entry_text, oneLine);
                  }
                  views.setTextViewText(R.id.widget_stats_text, statsText != null ? statsText : "0d • 0w");

                  Intent openAppIntent = new Intent(context, MainActivity.class);
                  openAppIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent openPendingIntent = PendingIntent.getActivity(
                          context, 0, openAppIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  views.setOnClickPendingIntent(R.id.widget_root, openPendingIntent);
                  views.setOnClickPendingIntent(R.id.widget_time_clock, openPendingIntent);
                  views.setOnClickPendingIntent(R.id.widget_entry_text, openPendingIntent);

                  Intent stampIntent = new Intent(context, TraceWidgetProvider.class);
                  stampIntent.setAction(ACTION_WIDGET_STAMP);
                  PendingIntent stampPendingIntent = PendingIntent.getBroadcast(
                          context, 1, stampIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  views.setOnClickPendingIntent(R.id.widget_stamp_btn, stampPendingIntent);

                  Intent themeIntent = new Intent(context, TraceWidgetProvider.class);
                  themeIntent.setAction(ACTION_WIDGET_THEME_TOGGLE);
                  PendingIntent themePendingIntent = PendingIntent.getBroadcast(
                          context, 2, themeIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  views.setOnClickPendingIntent(R.id.widget_theme_btn, themePendingIntent);

                  appWidgetManager.updateAppWidget(appWidgetId, views);
              }
          }
          ''')

          main_java_path = os.path.join(base, "app/src/main/java/com/muneebwanee/trace/MainActivity.java")
          if os.path.exists(main_java_path):
              mj = open(main_java_path, encoding="utf-8").read()
              if "setDarkMode" not in mj and "public class AndroidBridge {" in mj:
                  bridge_add = r'''
                  @JavascriptInterface
                  public void setDarkMode(boolean isDark) {
                      SharedPreferences wPrefs = getSharedPreferences(TraceWidgetProvider.WIDGET_PREFS, Context.MODE_PRIVATE);
                      wPrefs.edit().putBoolean(TraceWidgetProvider.KEY_DARK_MODE, isDark).apply();
                      TraceWidgetProvider.updateAllWidgets(MainActivity.this);
                  }
                  '''
                  mj = mj.replace("public class AndroidBridge {", "public class AndroidBridge {" + chr(10) + bridge_add, 1)
                  open(main_java_path, "w", encoding="utf-8").write(mj)

          idx_path = os.path.join(base, "app/src/main/assets/index.html")
          if os.path.exists(idx_path):
              html = open(idx_path, encoding="utf-8").read()
              if "legalReaderModal" not in html and "Legal &amp; Privacy" not in html:
                  tf = "<!-- Minimal Attribution Footer"
                  legal_block = r'''
                  <div class="py-3.5 space-y-2" style="border-color: var(--line-rail);">
                    <div class="flex items-center justify-between">
                      <span class="font-medium">Legal &amp; Privacy</span>
                      <span class="text-[10px] uppercase" style="color: var(--text-subtle);">100% Offline</span>
                    </div>
                    <details class="rounded-lg border p-2.5 text-[11px] space-y-1.5" style="border-color: var(--line-rail);">
                      <summary class="cursor-pointer font-medium">Terms of Service (0.0.1v)</summary>
                      <p style="color: var(--text-muted);">Trace is an offline-first daily stream diary developed by muneebwanee. You retain 100% ownership and copyright over all entries you write. Provided AS IS under the MIT License.</p>
                    </details>
                    <details class="rounded-lg border p-2.5 text-[11px] space-y-1.5" style="border-color: var(--line-rail);">
                      <summary class="cursor-pointer font-medium">Privacy Policy &amp; Zero Telemetry</summary>
                      <p style="color: var(--text-muted);">Trace collects zero personal data, runs zero analytics or advertising SDKs, and stores all entries strictly on your device (and optional user-initiated cloud/file backups).</p>
                    </details>
                    <details class="rounded-lg border p-2.5 text-[11px] space-y-1.5" style="border-color: var(--line-rail);">
                      <summary class="cursor-pointer font-medium">Store EULA, Data Safety &amp; Local Wipe</summary>
                      <p style="color: var(--text-muted);">Complies with Apple App Store, Google Play API 36, Microsoft Store, and Linux store rules. Tap below to permanently erase all local diary data on this device:</p>
                      <button type="button" onclick="if(confirm('Permanently erase all local diary entries on this device?')){localStorage.clear();location.reload();}" class="mono-btn py-1 px-2.5 rounded text-[10.5px] mt-1">Erase All Local Diary Data</button>
                    </details>
                  </div>
                  '''
                  if tf in html:
                      html = html.replace(tf, legal_block + chr(10) + "        " + tf, 1)
                      open(idx_path, "w", encoding="utf-8").write(html)

          print("Verified all Android widget XML, drawable, string, signing, and Java resources.")

      - name: Configure Upload Keystore for Play Store Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd _build_android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          elif [ ! -f "upload-keystore.jks" ]; then
            keytool -genkeypair -v \
              -keystore upload-keystore.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "trace_store_pass_2026" \
              -keypass "trace_key_pass_2026" \
              -dname "CN=muneebwanee, OU=Trace, O=Trace, L=Srinagar, S=JK, C=IN"
          fi
          cp upload-keystore.jks release-upload-keystore.jks || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Signed Play Store Bundle (.aab) & Universal APK (.apk)
        working-directory: _build_android
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'trace_store_pass_2026' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'trace_key_pass_2026' }}
        run: |
          gradle bundleRelease assembleRelease --no-daemon
          cp app/build/outputs/bundle/release/*.aab ../release-out/Trace_PlayStore_API36.aab
          cp app/build/outputs/apk/release/*.apk ../release-out/Trace_Universal_API36.apk
          ls -lh ../release-out/

      - name: Upload Play Store AAB & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trace-Android-PlayStore-API36
          path: |
            release-out/Trace_PlayStore_API36.aab
            release-out/Trace_Universal_API36.apk
          if-no-files-found: error

      - name: Publish Android AAB & APK to Unified GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: v0.0.1-universal
          name: "Trace 0.0.1v — Official Store Releases (iOS .ipa • Android .aab/.apk • Windows .appx/.exe • Linux .AppImage/.deb)"
