name: Build Android Play Store (AAB & APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  issue_comment:
    types: [ created ]

permissions:
  contents: write

jobs:
  build-android-playstore:
    name: Build Android Play Store Bundle (.aab) & Universal APK (.apk)
    if: github.event_name != 'issue_comment' || contains( (github.event.comment.body), 'build' )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Platform 36 & Build-Tools 36.0.0
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | sort -V | tail -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Trace_Android_PlayStore.zip
        run: |
          mkdir -p _build_android release-out
          ZIP_FILE=$(find . -maxdepth 2 -iname "*Android*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting Android archive: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d _build_android
          elif [ -d "android/app" ]; then
            cp -r android/* _build_android/
          elif [ -d "app/src/main" ]; then
            cp -r app build.gradle settings.gradle gradle.properties _build_android/ 2>/dev/null || true
          fi

      - name: Verify & Self-Heal Android Auto-Theme Editorial Widget, Legal Pages & Signing Config
        shell: python3 {0}
        run: |
          import os, textwrap

          base = "_build_android"
          for d in [
              "app/src/main/res/values",
              "app/src/main/res/xml",
              "app/src/main/res/layout",
              "app/src/main/res/drawable",
              "app/src/main/java/com/muneebwanee/trace",
          ]:
              os.makedirs(os.path.join(base, d), exist_ok=True)

          def write_file(rel_path, content):
              p = os.path.join(base, rel_path)
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).strip() + chr(10))

          write_file("app/build.gradle", r'''
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.muneebwanee.trace'
              compileSdk 36

              defaultConfig {
                  applicationId "com.muneebwanee.trace"
                  minSdk 24
                  targetSdk 36
                  versionCode 1
                  versionName "0.0.1"
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = false
                  }
              }

              signingConfigs {
                  release {
                      storeFile file("upload-keystore.jks")
                      storePassword "trace_upload_2026"
                      keyAlias "upload"
                      keyPassword "trace_upload_2026"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          ''')

          write_file("app/src/main/AndroidManifest.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <supports-screens
                  android:smallScreens="true"
                  android:normalScreens="true"
                  android:largeScreens="true"
                  android:xlargeScreens="true"
                  android:anyDensity="true" />

              <application
                  android:allowBackup="true"
                  android:fullBackupContent="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:resizeableActivity="true"
                  android:theme="@android:style/Theme.DeviceDefault.DayNight">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".TraceWidgetProvider"
                      android:exported="true"
                      android:label="Trace">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="android.intent.action.CONFIGURATION_CHANGED" />
                          <action android:name="android.intent.action.DATE_CHANGED" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/trace_widget_info" />
                  </receiver>
              </application>

          </manifest>
          ''')

          write_file("app/src/main/res/values/strings.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Trace</string>
              <string name="widget_desc">Auto-theme minimalist editorial clock, 7-day stream rhythm, and daily mirror reflection.</string>
          </resources>
          ''')

          write_file("app/src/main/res/xml/trace_widget_info.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:minResizeWidth="180dp"
              android:minResizeHeight="110dp"
              android:maxResizeWidth="520dp"
              android:maxResizeHeight="320dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/trace_widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen|keyguard"
              android:description="@string/widget_desc" />
          ''')

          write_file("app/src/main/res/drawable/widget_bg_paper.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F4F3EE" />
              <corners android:radius="28dp" />
              <stroke android:width="1.2dp" android:color="#261C1C1A" />
          </shape>
          ''')

          write_file("app/src/main/res/drawable/widget_bg_dark.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#121211" />
              <corners android:radius="28dp" />
              <stroke android:width="1.2dp" android:color="#2EF4F3EE" />
          </shape>
          ''')

          write_file("app/src/main/res/drawable/widget_pill_light.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#E8E6DF" />
              <corners android:radius="16dp" />
              <stroke android:width="0.8dp" android:color="#181C1C1A" />
          </shape>
          ''')

          write_file("app/src/main/res/drawable/widget_pill_dark.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#1C1C1A" />
              <corners android:radius="16dp" />
              <stroke android:width="0.8dp" android:color="#1FF4F3EE" />
          </shape>
          ''')

          write_file("app/src/main/res/drawable/widget_dot_filled.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#1C1C1A" />
              <size android:width="6dp" android:height="6dp" />
          </shape>
          ''')

          write_file("app/src/main/res/drawable/widget_dot_light.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#F4F3EE" />
              <size android:width="6dp" android:height="6dp" />
          </shape>
          ''')

          write_file("app/src/main/res/layout/trace_widget.xml", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg_paper"
              android:orientation="vertical"
              android:padding="16dp">

              <RelativeLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content">

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentStart="true"
                      android:layout_centerVertical="true"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <ImageView
                          android:id="@+id/widget_node_dot"
                          android:layout_width="6dp"
                          android:layout_height="6dp"
                          android:layout_marginEnd="7dp"
                          android:src="@drawable/widget_dot_filled" />

                      <TextView
                          android:id="@+id/widget_brand_label"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:fontFamily="monospace"
                          android:letterSpacing="0.16"
                          android:text="TRACE"
                          android:textAllCaps="true"
                          android:textColor="#881C1C1A"
                          android:textSize="9.5sp" />
                  </LinearLayout>

                  <TextClock
                      android:id="@+id/widget_date_pill"
